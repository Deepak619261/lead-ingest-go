# docker compose -f deploy/docker-compose.yml up --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: leadingest
      POSTGRES_PASSWORD: leadingest
      POSTGRES_DB: leadingest
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadingest"]
      interval: 2s
      retries: 20

  mockengine:
    build: ..
    entrypoint: ["mockengine", "-addr", ":8090", "-latency", "30ms", "-per-lead", "50us", "-capacity", "8"]
    ports: ["8090:8090"]

  ingest:
    build: ..
    command: ["-addr", ":8080", "-sink", "pg", "-shards", "8", "-workers", "4"]
    environment:
      LEADINGEST_PG_URL: postgres://leadingest:leadingest@postgres:5432/leadingest
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    stop_grace_period: 60s

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
